version: '3.8'

services:
  backend:
    build:
      context: ./ProjectSMHRD
      dockerfile: Dockerfile.dev
    container_name: edutech-backend-dev
    ports:
      - "8070:8070"
    env_file:
      - ./ProjectSMHRD/.env.dev
    volumes:
      - ./ProjectSMHRD/data:/app/data

  frontend:
    build:
      context: ./mypro3
      dockerfile: Dockerfile.dev
    container_name: edutech-frontend-dev
    ports:
      - "80:80"
      - "3000:80"
    env_file:
      - ./mypro3/.env.dev
    depends_on:
      - backend
